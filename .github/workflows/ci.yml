name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system check
        env:
          GEMINI_API_KEY: ci-placeholder
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/lara-shehade/inventory-agent-cicd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/lara-shehade/inventory-agent-cicd:latest

  deploy:
    needs: test
    runs-on: [self-hosted, Windows, X64, inventory-deploy]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the latest image
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker pull ghcr.io/lara-shehade/inventory-agent-cicd:latest

          $existingContainer = docker ps -aq --filter "name=^inventory-agent$"
          if ($existingContainer) {
            docker rm -f inventory-agent
          }

          docker run -d `
            --name inventory-agent `
            --restart unless-stopped `
            -p 8000:8000 `
            -e GEMINI_API_KEY="$env:GEMINI_API_KEY" `
            ghcr.io/lara-shehade/inventory-agent-cicd:latest
